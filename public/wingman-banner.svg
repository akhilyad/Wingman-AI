<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="wmb-title wmb-desc">
  <title id="wmb-title">WingMan AI</title>
  <desc id="wmb-desc">AI dating conversation analyzer, reply workshop, and strategy coach with Express backend and Gemini fallback chain.</desc>
  <defs>
    <clipPath id="wmb-frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <radialGradient id="wmb-glow-lilac" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B79CFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#B79CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmb-glow-rose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9AC4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF9AC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmb-glow-mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3CC38A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3CC38A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wmb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="wmb-grid-fade" cx="0.42" cy="0.48" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="wmb-grid-mask">
      <rect width="1280" height="420" fill="url(#wmb-grid-fade)"/>
    </mask>
    <linearGradient id="wmb-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E2D4FF"/>
      <stop offset="1" stop-color="#FF9AC4"/>
    </linearGradient>
    <linearGradient id="wmb-top-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B79CFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#B79CFF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#FF9AC4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF9AC4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wmb-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8C8FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#B79CFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF9AC4" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="wmb-card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1833" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#100D1D" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="wmb-card-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wmb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset="1" stop-color="#FF9AC4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#wmb-frame)">
    <rect width="1280" height="420" fill="#0B0A14"/>
    <ellipse cx="220" cy="40" rx="500" ry="300" fill="url(#wmb-glow-lilac)"/>
    <ellipse cx="980" cy="360" rx="500" ry="290" fill="url(#wmb-glow-rose)"/>
    <ellipse cx="860" cy="70" rx="340" ry="220" fill="url(#wmb-glow-mint)"/>
    <rect width="1280" height="420" fill="url(#wmb-grid)" mask="url(#wmb-grid-mask)"/>

    <!-- Faint background paper-plane motif -->
    <g transform="translate(490 35) rotate(-14 210 190)" opacity="0.045">
      <path d="M40 215L395 45L265 380L195 240L40 215Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M195 240L395 45" stroke="#0B0A14" stroke-width="8"/>
    </g>

    <rect x="0" y="0" width="1280" height="2" fill="url(#wmb-top-line)"/>

    <!-- Eyebrow pill -->
    <g font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif">
      <rect x="80" y="66" width="286" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#B79CFF" stroke-opacity="0.38"/>
      <circle cx="101" cy="82" r="8" fill="#3CC38A" fill-opacity="0.25"/>
      <circle cx="101" cy="82" r="4" fill="#3CC38A"/>
      <text x="118" y="87" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#EDE9FE">AI DATING CONVERSATION COACH</text>
    </g>

    <!-- Wordmark -->
    <text x="76" y="192" font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="url(#wmb-wordmark)">WINGMAN AI</text>

    <!-- Tagline -->
    <text x="80" y="240" font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">AI chat analyzer, reply workshop, and strategy coach</text>

    <!-- Feature chips -->
    <g font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">
      <rect x="80" y="278" width="110" height="36" rx="18" fill="#B79CFF" fill-opacity="0.16" stroke="#B79CFF" stroke-opacity="0.58"/>
      <text x="135" y="301" fill="#E9D8FD">Analyzer</text>

      <rect x="202" y="278" width="152" height="36" rx="18" fill="#FF9AC4" fill-opacity="0.15" stroke="#FF9AC4" stroke-opacity="0.55"/>
      <text x="278" y="301" fill="#FFD6E8">Reply Workshop</text>

      <rect x="366" y="278" width="146" height="36" rx="18" fill="#3CC38A" fill-opacity="0.14" stroke="#3CC38A" stroke-opacity="0.5"/>
      <text x="439" y="301" fill="#A7F3D0">Strategy Coach</text>

      <rect x="524" y="278" width="136" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="592" y="301" fill="#E2E8F0">PWA &amp; TWA</text>
    </g>

    <!-- Stack line -->
    <text x="80" y="364" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="500" letter-spacing="0.4" fill="#9E97B8">React 19 · Vite 6 · Express 4 · Tailwind CSS 4 · @google/genai</text>

    <!-- Right motif card -->
    <rect x="846" y="48" width="352" height="296" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#B79CFF" stroke-opacity="0.2" transform="rotate(4 1022 196)"/>
    <rect x="826" y="64" width="372" height="296" rx="22" fill="url(#wmb-card-fill)"/>
    <rect x="826" y="64" width="372" height="120" rx="22" fill="url(#wmb-card-sheen)"/>
    <rect x="826.75" y="64.75" width="370.5" height="294.5" rx="21.25" fill="none" stroke="url(#wmb-card-border)" stroke-width="1.5"/>

    <g font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif">
      <text x="854" y="102" font-size="17" font-weight="700" fill="#F8FAFC">Conversation readout</text>
      <rect x="1080" y="84" width="94" height="26" rx="13" fill="#3CC38A" fill-opacity="0.16" stroke="#3CC38A" stroke-opacity="0.48"/>
      <text x="1127" y="101" font-size="12" font-weight="700" text-anchor="middle" fill="#A7F3D0">High spark</text>

      <!-- Interest radial arc -->
      <circle cx="910" cy="186" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="10"/>
      <circle cx="910" cy="186" r="46" fill="none" stroke="url(#wmb-ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="248 290" transform="rotate(-90 910 186)"/>
      <text x="910" y="185" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">86%</text>
      <text x="910" y="203" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle" fill="#CBD5E1">INTEREST</text>

      <!-- Signals list -->
      <circle cx="984" cy="158" r="4.5" fill="#3CC38A"/>
      <text x="996" y="162" font-size="13" font-weight="600" fill="#E2E8F0">Playful callback landed</text>
      <circle cx="984" cy="186" r="4.5" fill="#3CC38A"/>
      <text x="996" y="190" font-size="13" font-weight="600" fill="#E2E8F0">Fast question reciprocity</text>
      <circle cx="984" cy="214" r="4.5" fill="#F5A623"/>
      <text x="996" y="218" font-size="13" font-weight="600" fill="#CBD5E1">Trim setup before invite</text>

      <!-- Tone pills inside card -->
      <rect x="854" y="264" width="98" height="32" rx="10" fill="#B79CFF" fill-opacity="0.14" stroke="#B79CFF" stroke-opacity="0.4"/>
      <text x="903" y="285" font-size="12.5" font-weight="700" text-anchor="middle" fill="#E9D8FD">Smooth</text>
      <rect x="962" y="264" width="98" height="32" rx="10" fill="#FF9AC4" fill-opacity="0.14" stroke="#FF9AC4" stroke-opacity="0.4"/>
      <text x="1011" y="285" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFD6E8">Funny</text>
      <rect x="1070" y="264" width="98" height="32" rx="10" fill="#3B82F6" fill-opacity="0.18" stroke="#60A5FA" stroke-opacity="0.45"/>
      <text x="1119" y="285" font-size="12.5" font-weight="700" text-anchor="middle" fill="#BFDBFE">Direct</text>

      <line x1="854" y1="316" x2="1172" y2="316" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="854" y="338" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#9E97B8">Fallback chain · 3 Gemini models · JSON Schema</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>

